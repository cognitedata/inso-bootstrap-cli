name: ci

on:
  # only during testing of the action from a different branch
  # pull_request:
  workflow_dispatch:
    # manually triggered only
    inputs:
      version:
        description: "image version (tag)"

jobs:
  printInputs:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Version: ${{ inputs.version }}"

  build:
    environment: CD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # https://github.com/docker/login-action#docker-hub
      - name: Docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

        # forked action. Original: buildpacks/github-actions/setup-pack
      - uses: cognitedata/github-actions/setup-pack@b8357b48cdb30302dc5712e87439436ac1e36e60 # v4.8.1

      # image version then used by solutions-registry helm chart.
      - run: pack/build.sh
        env:
          PUBLISH: true
          # VERSION: ${{ env.version }}
          VERSION: ${{ inputs.version }}
          IMAGE: cognite/bootstrap-cli
